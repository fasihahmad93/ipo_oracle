prompt: |
  You are an IPO research analyst.

  Consolidate the IPO information provided below from multiple sources into a single, clean markdown report.

  Requirements:
  - Read all IPO entries in the input text.
  - Combine duplicate or repeated records across sources.
  - Merge fields such as company name, GMP, issue price, lot size, opening date, and closing date.
  - Keep the most complete and specific values when multiple sources disagree.
  - If a field is missing, leave it as "Not available".
  - Prefer markdown headings, bullets, and tables where useful.
  - Do not invent facts not present in the source text.
  - Keep the report short and concise but informative.
 

  Output structure:
  # Consolidated IPO Report

  ## Summary
  - Total IPO entries found: <count>
  - Sources reviewed: <count>

  ## Detailed IPO Entries
  | Company | Opening Date | Closing Date | GMP | Issue Price | Lot Size | Source |

  ## Investing Strategy
  - Suggest some stock to be invested in based on the Grey Market Premium (GMP) and other factors. Provide a brief rationale for each suggestion.
